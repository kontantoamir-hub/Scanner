name: Performance Report

on:
  schedule:
    - cron: '0 8 1,16 * *'   # الساعة 08:00 UTC في يوم 1 و16 من كل شهر (تقريبًا كل 15 يومًا)
  workflow_dispatch:
    inputs:
      period_days:
        description: 'عدد الأيام التي يغطيها التقرير (اتركه فارغًا لاستخدام 15 يومًا)'
        required: false
        default: '15'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run performance report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          REPORT_PERIOD_DAYS: ${{ github.event.inputs.period_days || '15' }}
        run: python report.py
