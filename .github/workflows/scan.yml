name: Market Scanner

concurrency:
  group: market-scanner
  cancel-in-progress: false

on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # كل 15 دقيقة تقريبًا، بإزاحة عن بداية الساعة لتقليل الزحمة
  workflow_dispatch: {}       # يسمح بالتشغيل اليدوي من تبويب Actions لأي وقت

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          PAPER_TELEGRAM_TOKEN: ${{ secrets.PAPER_TELEGRAM_TOKEN }}
          PAPER_TELEGRAM_CHAT_ID: ${{ secrets.PAPER_TELEGRAM_CHAT_ID }}
          SCAN_INTERVAL: '1h'
          SCAN_DEPTH: '120'
          MARKET_REGIME_ADX_THRESHOLD: '25'
        run: python scanner.py

      - name: Export app data
        if: always()
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          PAPER_GIST_ID: ${{ secrets.PAPER_GIST_ID }}
          PAPER_GIST_TOKEN: ${{ secrets.PAPER_GIST_TOKEN }}
          APP_SIM_SINCE: ${{ vars.APP_SIM_SINCE }}
          SCAN_INTERVAL: '1h'
        run: python export_app_data.py