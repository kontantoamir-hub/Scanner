name: Analyze Trades

on:
  workflow_dispatch: {}   # تشغيل يدوي فقط: من تبويب Actions -> Analyze Trades -> Run workflow

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: تثبيت المتطلبات
        run: pip install requests

      - name: تشغيل تحليل متوسط العائد لكل عامل تشخيصي
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python analyze_trades.py