name: Build Dataset (Official)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Build dataset
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SCAN_INTERVAL: ${{ vars.SCAN_INTERVAL || '1h' }}
        run: python3 build_dataset.py

      # GitHub Actions ما بيقدرش يعدّل/يضيف ملفات بالـ repo تلقائيًا بدون خطوة commit
      # صريحة -- فبدل كده بنرفع الـCSV كـ"artifact" تقدر تحمّله من صفحة الـ run نفسها
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset_official
          path: dataset_official.csv
          retention-days: 30
