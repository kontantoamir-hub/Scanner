name: Invalidated What-If Analysis

on:
  workflow_dispatch: {}   # تشغيل يدوي فقط: من تبويب Actions -> Invalidated What-If Analysis -> Run workflow

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: تثبيت المتطلبات
        run: pip install requests

      - name: تشغيل تحليل "ماذا لو"
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python whatif_invalidated.py